version: 2

sources:
  - name: raw_data
    schema : SF_SCHEMA
    database: SNOWFLAKE_DBT_DATA
    tables:
      - name: CUST #logical 
        identifier: CUSTOMER  #main table
      - name : trans
        identifier: sales_transactions
      - name : order
        identifier: orders
      - name : scd2
        identifier: SUPPLY_CHAIN_ORDERS
      - name : source_refresh
        identifier: TELECOM_CUSTOMERS
        config: 
          freshness:
            warn_after: {count : 1 , period : day}
            error_after: {count : 2 , period : day}   
          loaded_at_field: REGISTERED_ON
      - name : source_refresh2
        identifier: TELECOM_CUSTOMERS
        config: 
          freshness:
            warn_after: {count : 1 , period : hour}
            error_after: {count : 2 , period : hour}   
          loaded_at_field: "convert_timezone('UTC',REGISTERED_ON)"
  - name: prod_data
    schema : PROD_SCH
    database: SNOWFLAKE_DBT_DATA
    tables:
      - name: prod
        identifier: PRODUCT